# inspr fleet configuration — example
#
# Copy to $XDG_CONFIG_HOME/inspr/fleet.conf (usually ~/.config/inspr/fleet.conf),
# or point $INSPR_FLEET_CONF at it. Home Manager users can have it rendered
# declaratively instead — see the inspr-cli module.
#
# Every value is optional. A check that needs one you have not set reports
# SKIP, never FAIL: `inspr check` is meant to be useful on a machine that has
# adopted none of this yet, and to get more useful as you fill it in.
#
# This is plain shell, sourced by the CLI. No secrets belong here — every value
# is an endpoint or a name, and the file is world-readable by default.

# ── Headscale / tailnet ─────────────────────────────────────────────────────
# Enables: headscale_reachable, tailscale_control_url
#
# The single gotcha these two exist for: a host can be up, Tailscale logged in,
# and the control server reachable — while pointed at Tailscale SaaS instead of
# your own Headscale. Both of the simpler checks pass in that state. Comparing
# the tailnet NAME is what tells them apart, which is why this needs declaring.
#
# HEADSCALE_URL is the SERVICE url, not the host it runs on.
INSPR_HEADSCALE_URL="https://headscale.example.org"
INSPR_TAILNET_NAME="headscale.example.org"

# ── Paimos / tracker ────────────────────────────────────────────────────────
# Used in the onboarding walkthrough's login instructions.
# INSTANCE is the local alias you log in under, not a URL.
INSPR_PAIMOS_URL="https://tracker.example.org"
INSPR_PAIMOS_INSTANCE="main"

# ── Pharos ──────────────────────────────────────────────────────────────────
# Base URL used for registration, beacon deployment, and post-deploy checks.
INSPR_PHAROS_URL="https://pharos.example.org"

# Host whose checkout holds the generated pharos manifests, used by
# `inspr post-deploy` to compare the handoff artifact. Leave unset if you do
# not run Pharos; the comparison is skipped.
INSPR_PHAROS_HOST="manifest-host"

# ── Git identity ─────────────────────────────────────────────────────────────
# Enables: git_identity_personal_default
INSPR_GIT_IDENTITY_NAME="Someone Example"
INSPR_GIT_IDENTITY_EMAIL="someone@example.com"

# ── Cosmetic ────────────────────────────────────────────────────────────────
# Host slug shown in `inspr --help` examples. Purely illustrative.
INSPR_EXAMPLE_HOST="web1"

# ── Layout overrides ────────────────────────────────────────────────────────
# Only needed if your checkouts are not where the CLI assumes.
# INSPR_NIXCFG_DIR="$HOME/Code/nixcfg"
# INSPR_DIR="$HOME/Code/inspr"
# INSPR_AGENT_SECRETS_DIR="$HOME/.inspr/secrets/agents"
