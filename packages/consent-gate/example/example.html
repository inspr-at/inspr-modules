<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>consent-gate example</title>
  <link rel="stylesheet" href="../consent-gate.css">
  <style>
    :root { --ic-accent: #2f6b4a; --ic-focus: #e7c574; }
    body { margin: 0; font-family: system-ui, sans-serif; padding: 24px; max-width: 800px; }
  </style>
</head>
<body>
  <h1>consent-gate example</h1>
  <p>Fresh visit: the bar appears (this manifest has tracking destinations). Reject, accept, or open the settings sheet. The video below stays a placeholder until you allow embeds once or always.</p>

  <!-- A contextual embed: the served markup carries data-src only, never a live src (deferred script cannot undo a request an src attribute already started). -->
  <iframe data-consent-embed="video" data-src="https://video.example.invalid/embed/1" width="560" height="315" title="Example video"></iframe>

  <footer>
    <a href="/privacy">Privacy notice</a> ·
    <button type="button" data-consent-open></button>
  </footer>

  <!-- The manifest travels with the page; the gate reads it before anything else runs. -->
  <script type="application/json" id="consent-manifest">
  {"version":1,"revision":1,"textVersion":1,"controller":"Example Operator GmbH","scope":"www.example.invalid","cookieName":"consent","permissionDays":180,"refusalDays":183,"language":"en","privacyUrl":"/privacy","categories":[{"id":"necessary","required":true},{"id":"measurement"},{"id":"marketing"},{"id":"embeds"}],"services":[{"id":"analytics","category":"measurement","provider":"Example Analytics","purposes":["visit counting"],"storage":[{"kind":"cookie","name":"_ga*","days":400}],"destination":{"type":"gtag","tagId":"G-0000000000","consent":["analytics_storage"]}},{"id":"ads","category":"marketing","provider":"Example Ads","purposes":["conversion measurement","campaign attribution"],"storage":[{"kind":"cookie","name":"_gcl_*","days":90},{"kind":"local","name":"_gcl_ls"}],"destination":{"type":"gtag","tagId":"AW-000000000","consent":["ad_storage","ad_user_data"],"linkerAcceptIncoming":true,"conversion":{"sendTo":"AW-000000000/example","value":1.0,"currency":"EUR"}}},{"id":"video","category":"embeds","provider":"Example Video","purposes":["video playback"],"embed":{"host":"video.example.invalid"}}],"text":{"en":{"bar":{"text":"We use necessary cookies. With your consent we additionally measure visits and attribute campaigns.","link":"Privacy notice","accept":"Accept","reject":"Reject","settings":"Settings"},"sheet":{"title":"Privacy","intro":"Necessary cookies keep you signed in and protect forms. Everything else stays off until you switch it on here.","save":"Save","cancel":"Cancel","link":"Details and withdrawal: privacy notice"},"embed":{"loadOnce":"Load once","always":"Always allow","open":"or open on"},"control":"Privacy","categories":{"necessary":{"label":"Necessary","description":"Sign-in, forms, this setting. Always on."},"measurement":{"label":"Measurement","description":"Example Analytics counts visits; cookies up to 400 days."},"marketing":{"label":"Marketing","description":"Example Ads measures whether an ad led to a request; data may be transferred to the US; cookies up to 90 days."},"embeds":{"label":"Embedded content","description":"Videos from Example Video set their own cookies when loaded."}},"services":{"video":{"label":"Video from Example Video","description":"Example Video sets its own cookies and may transfer data abroad."}}}}}
  </script>
  <!-- data-consent-fire names the services whose conversion fires on this page (once per session). -->
  <script src="../consent-gate.js" defer data-consent-manifest="#consent-manifest" data-consent-fire=""></script>
</body>
</html>
